<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Within metro reach – Riyadh</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400&display=swap">
<style>
:root{--ink:#16222b;--muted:#5d6b75;--paper:#fbfaf7;--rule:#d9d5cc;--acc:#8a4a28;--soft:#efebe3}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink)}
#map{height:100%;background:#e8e6e0}
#map canvas.tm{position:absolute;left:0;top:0;pointer-events:none}
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:330px;max-width:calc(100% - 24px);box-sizing:border-box;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.45;box-shadow:0 4px 18px rgba(22,34,43,.18);max-height:calc(100% - 24px);overflow:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:20px;line-height:1.2;margin:0 0 4px;font-weight:600}
button{font:inherit;cursor:pointer}
.tools{display:flex;gap:6px;flex:none}
#lang{font-size:12px;padding:3px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
#infob{font-size:13px;font-weight:600;width:26px;height:26px;padding:0;border:1px solid var(--rule);border-radius:50%;background:#fff;color:var(--ink)}
.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
/* main tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:8px;margin:0 0 12px}
.tabs button{flex:1;border:0;border-radius:6px;background:none;padding:8px 6px;color:var(--ink);text-align:center;line-height:1.2}
.tabs button b{display:block;font-size:14px}
.tabs button small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.tabs button[aria-selected="true"]{background:var(--acc);color:#fff;box-shadow:0 1px 3px rgba(22,34,43,.2)}
.tabs button[aria-selected="true"] small{color:#f3e3c3}
/* segmented control inside a tab */
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:0 0 8px}
.seg button{flex:1;border:0;background:#fff;padding:7px 6px;color:var(--ink);font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:#f3e3c3;font-weight:600}
#follow{width:100%;padding:7px 8px;border:1px solid var(--acc);border-radius:4px;background:#fff;color:var(--acc)}
#follow[aria-pressed="true"]{background:var(--acc);color:#fff}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
#out{margin:10px 0 0;min-height:44px}
#out .big{font-size:26px;font-weight:600;color:var(--acc);line-height:1.1;margin-right:4px}
details{border-top:1px solid var(--rule);padding-top:8px;margin-top:10px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin-top:8px}
.sl input{grid-column:1/3;width:100%;accent-color:var(--acc)}
.sl[hidden]{display:none}
select{width:100%;font:inherit;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
#wtrow{margin-top:8px;font-size:13px;color:var(--muted)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
#chips label{display:flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
#chips input{margin:0}
#info{margin:12px 0;min-height:20px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#stat{margin:12px 0 0}
#stat .big{font-size:28px;font-weight:600;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
#stat .lead{font-size:13px;margin:2px 0 6px}
#stat .hd{font-size:12px;color:var(--muted);margin:8px 0 2px}
#stat .gauge{height:8px;background:#e7e4dc;border-radius:4px;overflow:hidden;margin:4px 0 6px}
#stat .gauge i{display:block;height:100%;background:var(--acc)}
#stat .rk{margin:4px 0 0;padding:0;list-style:none;font-size:13px}
#stat .rk li{display:flex;gap:8px;margin:3px 0;cursor:pointer}
#stat .rk li:hover .nm{text-decoration:underline}
#stat .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stat .tp{width:54px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* legend (shared by all modes) */
.legend{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.legend p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}
.sw{width:22px;height:12px;border-radius:2px;border:1px solid rgba(22,34,43,.25);flex:none}
.lab{width:52px;flex:none;white-space:nowrap}
.legend.simple .lab{width:auto}
.bar{flex:1;height:6px;background:#e7e4dc;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.val{width:66px;text-align:right;flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pop{width:52px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.row.head{margin:0 0 2px;color:var(--muted);font-size:12px}
.legend.simple .bar,.legend.simple .val,.legend.simple .pop,.legend.simple .row.head{display:none}
.note{margin:6px 0 0;font-size:12px;color:var(--muted)}
.credit{margin:10px 0 0;font-size:12px;color:var(--muted)}
.credit a{color:var(--acc)}
.error{color:#9b1c1c}
#tip{position:absolute;z-index:900;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:2px 7px;border-radius:3px;display:none;white-space:nowrap}
.leaflet-tooltip{font-family:inherit}
.basectl{display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.35);overflow:hidden}
.basectl button{border:0;background:#fff;color:var(--ink);font-size:12px;padding:5px 9px;text-align:left}
.basectl button+button{border-top:1px solid var(--rule)}
.basectl button[aria-pressed="true"]{background:var(--acc);color:#fff}
#summer{width:100%;margin:0 0 12px;padding:7px 8px;border:1px solid #d9a400;border-radius:6px;background:#fff;color:#7a5a00;text-align:left}
#summer[aria-pressed="true"]{background:#f5c400;border-color:#f5c400;color:#16222b;font-weight:600}
#summer small{display:block;font-size:11px;font-weight:400;color:inherit;opacity:.85}
#about{position:fixed;inset:0;z-index:2000;background:rgba(22,34,43,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#about[hidden]{display:none}
#about .box{background:var(--paper);border-radius:8px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;font-size:14px;line-height:1.5;box-shadow:0 10px 40px rgba(22,34,43,.35);position:relative}
#about h2{font-size:18px;margin:0 0 4px}
#about h3{font-size:14px;margin:16px 0 4px}
#about p{margin:4px 0}
#about ul{margin:4px 0;padding-left:18px}
#about li{margin:3px 0}
#about .by{color:var(--muted);margin:0 0 8px}
/* footbridges tab */
#bsum .big{font-size:28px;font-weight:600;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
#bsum .lead{font-size:13px;margin:2px 0 4px}
#bsum .sm{font-size:12px;color:var(--muted)}
.blist{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.blist li{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:4px;cursor:pointer}
.blist li:hover{background:var(--soft)}
.blist li[aria-current="true"]{background:#f3e3c3}
.blist .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.blist .rd{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blist .pp{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.blist .gm{width:78px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.blist .hd{cursor:default;color:var(--muted);font-size:12px}
.blist .hd:hover{background:none}
#bdet{margin:10px 0 0}
#bdet .big{font-size:28px;font-weight:600;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
#bdet p{margin:4px 0;font-size:13px}
#bdet .flag{background:var(--soft);border-left:3px solid var(--acc);padding:6px 8px;font-size:12px;margin:8px 0}
#bback{margin:8px 0 0;padding:5px 9px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);font-size:12px}
.chk{display:flex;gap:6px;align-items:center;margin:12px 0 0;font-size:13px;cursor:pointer}
#bleg{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
#bleg p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.bnum{background:var(--ink);color:#fff;border:2px solid #fff;border-radius:50%;font:600 11px/18px "IBM Plex Sans",sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.exb{background:#0f766e;border:2px solid #fff;border-radius:2px;box-sizing:border-box;box-shadow:0 0 0 1px #0f766e,0 1px 3px rgba(0,0,0,.35)}
.exb.off{background:#fff;border-color:#0f766e;box-shadow:none}
.bnum.on{background:var(--acc);transform:scale(1.25)}
/* ===== phones only (desktop unchanged) ===== */
#grab{display:none}
@media (max-width:640px){
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;max-height:60vh;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:4px 14px 14px;font-size:13px;box-shadow:0 -4px 18px rgba(22,34,43,.22);transition:max-height .2s}
  #panel.collapsed{max-height:164px;overflow:hidden}
  #grab{display:flex;justify-content:center;align-items:center;width:100%;height:22px;margin:0 0 2px;border:0;background:none;padding:0}
  #grab span{display:block;width:44px;height:5px;border-radius:3px;background:#c9c3b8}
  h1{font-size:17px}
  .sub{font-size:12px;margin:0 0 8px}
  .tabs{margin:0 0 8px}
  .tabs button{padding:6px 4px}
  .tabs button b{font-size:12.5px}
  .tabs button small{font-size:10px}
  #stat .big,#bsum .big,#bdet .big{font-size:24px}
  .leaflet-bottom.leaflet-right{bottom:164px}
  .leaflet-top.leaflet-right{top:4px}
}
#closeb{position:absolute;top:10px;right:10px;font-size:18px;width:30px;height:30px;border:0;background:none;color:var(--muted);border-radius:4px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <button id="grab" type="button" aria-label="Show / hide the panel"><span></span></button>
  <div class="top"><h1 id="t1"></h1><div class="tools"><button id="infob" type="button" aria-haspopup="dialog">i</button><button id="lang" type="button"></button></div></div>
  <p class="sub" id="sub"></p>
  <div class="tabs" role="tablist">
    <button id="tabR" type="button" role="tab" aria-selected="true">🚇 <b id="t_tabR"></b><small id="t_tabRs"></small></button>
    <button id="tabC" type="button" role="tab" aria-selected="false">👥 <b id="t_tabC"></b><small id="t_tabCs"></small></button>
    <button id="tabB" type="button" role="tab" aria-selected="false">🌉 <b id="t_tabB"></b><small id="t_tabBs"></small></button>
  </div>
  <button id="summer" type="button" aria-pressed="false"><span id="t_summer"></span><small id="t_summerS"></small></button>
  <section id="pR">
    <div class="seg" role="group"><button id="segM" type="button" aria-pressed="true"></button><button id="segW" type="button" aria-pressed="false"></button></div>
    <button id="follow" type="button" aria-pressed="true"></button>
    <p class="hint" id="hint"></p>
    <div id="out"></div>
    <details id="setbox"><summary id="lset"></summary><div id="sliders"></div></details>
  </section>
  <section id="pC" hidden>
    <select id="sel" aria-label="Station"></select>
    <div id="wtrow" hidden><div id="t_wt"></div><div id="chips"></div><select id="sty" aria-label="Display"><option value="near"></option><option value="over"></option></select></div>
    <div id="stat"></div>
    <div id="info"></div>
  </section>
  <section id="pB" hidden>
    <div id="t_bmeas" class="hint" style="margin:0 0 4px"></div>
    <div class="seg" id="bseg" role="group"><button type="button" data-t="10" aria-pressed="false">10 min</button><button type="button" data-t="15" aria-pressed="true">15 min</button><button type="button" data-t="20" aria-pressed="false">20 min</button><button type="button" data-t="all" aria-pressed="false" id="t_ball"></button></div>
    <div id="bsum"></div>
    <div id="bdet" hidden></div>
    <ul id="blist" class="blist"></ul>
    <label class="chk"><input type="checkbox" id="bex"><span id="t_bex"></span></label>
    <div id="bleg"></div>
  </section>
  <div class="legend" id="legend"></div>
  <details><summary id="t_how"></summary><p class="note" id="note"></p></details>
  <p class="credit" id="t_credit"></p>
</div>
<div id="about" hidden role="dialog" aria-modal="true" aria-labelledby="ab_t"><div class="box"><button id="closeb" type="button" aria-label="Close">×</button><div id="ab_c"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LINE_ORDER = ['Blue', 'Red', 'Orange', 'Yellow', 'Green', 'Purple'];
const LINE_COLORS = {Blue:'#1d6fc4', Red:'#e03a3a', Orange:'#f28c28', Yellow:'#f5c400', Green:'#2e9e4f', Purple:'#8a4fb8'};
const MIN_COLORS = {5:'#f6ead0', 10:'#ecd3a6', 15:'#e0b97d', 20:'#cf9a5a', 25:'#b97b3e', 30:'#9f5f2d', 40:'#834723', 50:'#66331b', 60:'#4a2213'};
const TH = [5, 10, 15, 20, 25, 30, 40, 50, 60], TMAX = 60, RGBM = {};
TH.forEach(m => { const h = MIN_COLORS[m]; RGBM[m] = [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); });
const KMH = 4.8;   // walking speed used for the precomputed station zones
const AUTH = 'KHAMASSI Abderrahmane';
const ABOUT_EN = `<h2 id="ab_t">About this map</h2><p class="by">A project by ${AUTH}</p>
<p>One map, three questions. <b>Travel time</b>: from any point, how far can you get on foot, or on foot and by metro? <b>People served</b>: how far can you walk from each of the 83 stations, and how many people live within reach? <b>Footbridges</b>: where would a pedestrian bridge bring the most people closer to the metro?</p>
<h3>Method</h3><ul>
<li>Walking follows the real pedestrian network built from OpenStreetMap streets and paths, including shared cycle paths such as the Sports Boulevard (motorways, expressways and major avenues treated as barriers, crossable only at traffic lights, pedestrian crossings, bridges or underpasses). Major avenues have a sidewalk on each side: you can walk along them, but not cross them elsewhere. Footbridges and pedestrian underpasses mapped in OpenStreetMap are linked to the nearest sidewalk or street. Small isolated pieces (under 50 points) are dropped. Each point is attached to the nearest street; areas more than 200 m from any street are left blank.</li>
<li>The metro network is built from the 6 lines and 83 stations mapped in OpenStreetMap. Door-to-door time = walk to a station + wait + ride (+ transfers) + walk from the arrival station, found with Dijkstra's algorithm on both networks, live in your browser.</li>
<li>Default assumptions, adjustable under Travel time: walking 4.8 km/h; metro commercial speed 40 km/h; 3 min wait (headways of 3–5 min at peak, 5–10 min off-peak); 5 min per transfer.</li>
<li>Summer mode: at 45 °C nobody walks far, so each walk to or from the metro is capped (10 min by default, adjustable); places beyond that cap are shown as out of reach.</li>
<li>The People served zones use the same network and rules, precomputed at 4.8 km/h. Population is summed from the WorldPop 2024 grid (100 m); in the all-stations view, people within reach of several stations are counted once.</li>
<li>Footbridges: every 50 m along each motorway, expressway and major avenue, a straight footbridge is tested across the road, perpendicular to it, from the first street on one side to the first street on the other (span + 1 min for stairs or lifts). Sites closer than 150 m to a station (the station already crosses the avenue) or to a footbridge or underpass mapped in OpenStreetMap are left out. For each one, walking times to the nearest station are recomputed on the same network, and the people counted are those who come within 15 min on foot of a station thanks to it (WorldPop, 50 m grid, as in People served). Sites are picked one after another, each taking the previous ones into account, at least 500 m apart, and kept only if they bring at least 1,500 people within 15 min. After checking the satellite view, two sites where a crossing already exists and one construction site counted as inhabited were removed. The green area only covers inhabited 50 m cells, without the roads themselves. Sites are chosen on the 15 min measure; the 10 and 20 min buttons show the same sites against those thresholds, and “All 3” overlays the three areas.</li></ul>
<h3>Limits</h3><ul>
<li>No timetable, no crowding, no traffic: these are typical times, not a journey planner.</li>
<li>Where OpenStreetMap lacks footpaths or includes private compounds, walking times can be over- or underestimated. Crossings depend on how traffic lights and pedestrian crossings are mapped in OpenStreetMap: a missing crossing makes a road look impassable.</li>
<li>Entrances are approximated: a station can be reached from any street within 100 m of it, on every side of the avenue, so the station itself works as a crossing. WorldPop figures are modelled estimates, not a census.</li></ul>
<h3>Sources</h3><ul>
<li>Metro lines, stations and streets: © OpenStreetMap contributors (ODbL)</li>
<li>Population: WorldPop 2024 (CC BY 4.0)</li>
<li>Basemaps: OpenStreetMap (default), Esri World Light Gray Canvas, Esri World Imagery (satellite)</li>
<li>Tools: ArcGIS Pro, Python, Leaflet</li></ul>`;
const ABOUT_FR = `<h2 id="ab_t">À propos de cette carte</h2><p class="by">Un projet de ${AUTH}</p>
<p>Une carte, trois questions. <b>Temps de trajet</b> : depuis n'importe quel point, jusqu'où peut-on aller à pied, ou à pied et en métro ? <b>Habitants desservis</b> : jusqu'où peut-on marcher depuis chacune des 83 stations, et combien d'habitants vivent à portée ? <b>Passerelles</b> : où une passerelle piétonne rapprocherait-elle le plus d'habitants du métro ?</p>
<h3>Méthode</h3><ul>
<li>La marche suit le vrai réseau piéton construit à partir des rues et chemins d'OpenStreetMap, y compris les voies partagées avec les vélos comme le Sports Boulevard (autoroutes, voies rapides et grandes avenues traitées comme des barrières, traversables seulement aux feux, passages piétons, passerelles ou souterrains). Les grandes avenues ont un trottoir de chaque côté : on peut les longer, mais pas les traverser ailleurs. Les passerelles et souterrains piétons cartographiés dans OpenStreetMap sont reliés au trottoir ou à la rue la plus proche. Les petits morceaux isolés (moins de 50 points) sont écartés. Chaque point est rattaché à la rue la plus proche ; les zones à plus de 200 m de toute rue restent vides.</li>
<li>Le réseau de métro est construit à partir des 6 lignes et 83 stations d'OpenStreetMap. Temps de porte à porte = marche jusqu'à une station + attente + trajet (+ correspondances) + marche depuis la station d'arrivée, calculé avec l'algorithme de Dijkstra sur les deux réseaux, en direct dans ton navigateur.</li>
<li>Hypothèses par défaut, réglables dans Temps de trajet : marche à 4,8 km/h ; vitesse commerciale du métro 40 km/h ; attente de 3 min (intervalles de 3 à 5 min en pointe, 5 à 10 min en creux) ; 5 min par correspondance.</li>
<li>Mode été : à 45 °C personne ne marche longtemps, donc chaque trajet à pied vers ou depuis le métro est plafonné (10 min par défaut, réglable) ; au-delà, les lieux apparaissent hors de portée.</li>
<li>Les zones d'Habitants desservis utilisent le même réseau et les mêmes règles, précalculées à 4,8 km/h. La population est la somme de la grille WorldPop 2024 (100 m) ; dans la vue toutes stations, une personne à portée de plusieurs stations n'est comptée qu'une fois.</li>
<li>Passerelles : tous les 50 m le long de chaque autoroute, voie rapide et grande avenue, une passerelle droite est testée au-dessus de la route, perpendiculairement, de la première rue d'un côté à la première rue de l'autre (portée + 1 min pour les escaliers ou ascenseurs). Les sites à moins de 150 m d'une station (la station traverse déjà l'avenue) ou d'une passerelle ou d'un souterrain cartographié dans OpenStreetMap sont écartés. Pour chacune, les temps de marche jusqu'à la station la plus proche sont recalculés sur le même réseau, et l'on compte les habitants qui arrivent grâce à elle à moins de 15 min à pied d'une station (WorldPop, grille de 50 m, comme dans Habitants desservis). Les sites sont choisis l'un après l'autre en tenant compte des précédents, à au moins 500 m les uns des autres, et gardés seulement s'ils amènent au moins 1 500 habitants à moins de 15 min. Après vérification sur la vue satellite, deux sites où une traversée existe déjà et un terrain en chantier compté comme habité ont été retirés. La zone verte ne couvre que les carrés de 50 m habités, sans la chaussée. Les sites sont choisis sur la mesure à 15 min ; les boutons 10 et 20 min montrent les mêmes sites pour ces seuils, et « Les 3 » superpose les trois zones.</li></ul>
<h3>Limites</h3><ul>
<li>Ni horaires, ni affluence, ni trafic : ce sont des temps typiques, pas un calculateur d'itinéraire.</li>
<li>Là où OpenStreetMap manque de cheminements piétons ou inclut des résidences privées, les temps de marche peuvent être sur- ou sous-estimés. Les traversées dépendent des feux et passages piétons cartographiés dans OpenStreetMap : un passage manquant rend une avenue infranchissable sur la carte.</li>
<li>Les bouches de métro sont approchées : une station est accessible depuis toute rue à moins de 100 m, de chaque côté de l'avenue, si bien que la station sert elle-même de traversée. Les chiffres WorldPop sont des estimations modélisées, pas un recensement.</li></ul>
<h3>Sources</h3><ul>

$('sel').addEventListener('change', () => { const v = $('sel').value; v === '__all' ? showAll() : v ? select(v) : resetC(); });
$('chips').addEventListener('change', e => { const m = +e.target.value; e.target.checked ? COV.on.add(m) : COV.on.delete(m); if (COV.view === 'all') showAll(false); });
$('sty').addEventListener('change', () => { COV.style = $('sty').value; if (COV.view === 'all') showAll(false); });

/* ================= SUMMER MODE ================= */
function applySummer() {
  $('summer').setAttribute('aria-pressed', P.summer);
  $('sl_cap').hidden = !P.summer;
  // coverage: keep only the walking times allowed in summer
  COV.on = new Set(P.summer ? TH.filter(m => m <= P.cap) : TH);
  document.querySelectorAll('#chips input').forEach(c => { c.checked = COV.on.has(+c.value); c.disabled = P.summer && +c.value > P.cap; });
  texts();
  if (tab === 'reach') later();
  else if (COV.iso) { COV.view === 'all' ? showAll(false) : COV.view === 'one' ? select(COV.cur, true) : (showLegend(), showStat()); }
}
$('summer').addEventListener('click', () => { P.summer = !P.summer; applySummer(); });

/* ================= FOOTBRIDGES ================= */
const GAIN_C = {2:'#b9e09b', 5:'#7cc464', 10:'#3e9a46', 20:'#1b5e2e'};
const BRG = {p:null, br:null, zones:null, ex:null, st:null, layer:null, exLayer:null, cur:null, t:15};
const TT = () => BRG.t === 'all' ? 15 : BRG.t, ZC = {10:'#1f6b34', 15:'#4fa356', 20:'#a6d68c'}, ZO = {10:.62, 15:.5, 20:.45};
const PP = (p, t = TT()) => p['people_' + t] != null ? p['people_' + t] : p.people, PG = (p, t = TT()) => p['gain_avg_' + t] != null ? p['gain_avg_' + t] : p.gain_avg_min;
function loadBrg() {
  if (!BRG.p) BRG.p = Promise.all(['passerelles.geojson', 'passerelles_gain.geojson', 'passerelles_existantes.geojson', 'passerelles_stats.json'].map(getJSON))
    .then(([b, z, e, s]) => { BRG.br = b; BRG.zones = z; BRG.ex = e; BRG.st = s; });
  return BRG.p;
}
function clearBrg() { [BRG.layer, BRG.exLayer].forEach(l => { if (l) map.removeLayer(l); }); BRG.layer = BRG.exLayer = null; }
const roadOf = p => { const n = (lang === 'fr' ? p.name_fr : p.name_en) || T[lang].rcN[p.road_class] || p.road_class; return n.charAt(0).toUpperCase() + n.slice(1); };
function drawBrg(fit) {
  clearBrg();
  const g = L.layerGroup(), cur = BRG.cur;
  const zf = BRG.zones.features.filter(f => (cur == null || f.properties.rank === cur) && (BRG.t === 'all' || f.properties.t === BRG.t)).sort((a, b) => b.properties.t - a.properties.t);
  L.geoJSON(zf, {pane:'iso',
    style: f => ({color:ZC[f.properties.t], weight:1, opacity:.9, fillColor:ZC[f.properties.t], fillOpacity:ZO[f.properties.t]}),
    onEachFeature: (f, l) => l.bindTooltip(() => '#' + f.properties.rank + ' · ' + tr('bZone')(f.properties.t, f.properties.people), {sticky:true})}).addTo(g);
  BRG.br.features.forEach(f => {
    const p = f.properties, on = cur == null || cur === p.rank, ll = f.geometry.coordinates.map(c => [c[1], c[0]]);
    L.polyline(ll, {pane:'lines', color:'#fff', weight:10, opacity:on ? 1 : .5, interactive:false}).addTo(g);
    L.polyline(ll, {pane:'lines', color: cur === p.rank ? '#8a4a28' : '#16222b', weight:5, opacity:on ? 1 : .45, interactive:false}).addTo(g);
    const mk = L.marker([p.lat, p.lon], {pane:'stations', keyboard:false, opacity:on ? 1 : .55,
      icon:L.divIcon({className:'bnum' + (cur === p.rank ? ' on' : ''), html:String(p.rank), iconSize:[22, 22]})}).addTo(g);
    mk.bindTooltip(() => '#' + p.rank + ' · ' + roadOf(p) + ' · ' + fmt(PP(p)) + ' ' + tr('ppl'));
    mk.on('click', ev => { L.DomEvent.stop(ev); pickBrg(cur === p.rank ? null : p.rank); });
  });
  BRG.layer = g.addTo(map);
  if ($('bex').checked) {
    BRG.exLayer = L.geoJSON(BRG.ex, {pane:'stations', pointToLayer: (f, ll) => L.marker(ll, {keyboard:false,
      icon:L.divIcon({className:'exb' + (f.properties.status === 'unlinkable' ? ' off' : ''), iconSize:[11, 11]})}),
      onEachFeature: (f, l) => l.bindTooltip(() => tr('bExT')(f.properties.status))}).addTo(map);
  }
  if (fit) {
    const src = cur == null ? BRG.br.features : BRG.zones.features.filter(f => f.properties.rank === cur && (BRG.t === 'all' || f.properties.t === BRG.t));
    const b = L.geoJSON(src).getBounds(); if (b.isValid()) map.fitBounds(b, {padding:[40, 40], maxZoom: cur == null ? 13 : 15});
  }
}
function showBrg() {
  const st = BRG.st, c = st.combined, n = BRG.br.features.length;
  const s = $('bsum'); s.innerHTML = '';
  const add = (el, cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt; el.appendChild(d); return d; };
  const dlt = t => c['within_' + t + 'min'].after - c['within_' + t + 'min'].before, [big, lead] = tr('bSum')(dlt(TT()), n, TT());
  add(s, 'big', '+' + big); add(s, 'lead', lead);
  if (BRG.t === 'all') add(s, 'sm', tr('bSumAll')(dlt(10), dlt(20)));
  add(s, 'hint', tr('bIntro')(TT()));
  $('t_ball').textContent = tr('bAll');
  $('t_bmeas').textContent = tr('bMeasure');
  document.querySelectorAll('#bseg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t) === String(BRG.t)));
  const ALL = BRG.t === 'all', cols = ALL ? ['10 min', '15 min', '20 min'] : tr('bHead').slice(1);
  const ul = $('blist'); ul.innerHTML = '';
  const hd = document.createElement('li'); hd.className = 'hd';
  hd.innerHTML = '<span class="n" style="background:none"></span><span class="rd"></span>' + (ALL ? '<span class="pp"></span><span class="pp"></span><span class="pp"></span>' : '<span class="pp"></span><span class="gm"></span>');
  hd.children[1].textContent = tr('bHead')[0]; cols.forEach((t, i) => { hd.children[i + 2].textContent = t; }); ul.appendChild(hd);
  BRG.br.features.slice().sort((a, b) => PP(b.properties) - PP(a.properties)).forEach(f => {
    const p = f.properties, li = document.createElement('li');
    li.innerHTML = '<span class="n"></span><bdi class="rd"></bdi>' + (ALL ? '<span class="pp"></span><span class="pp"></span><span class="pp"></span>' : '<span class="pp"></span><span class="gm"></span>');
    li.children[0].textContent = p.rank; li.children[1].textContent = roadOf(p);
    if (ALL) [10, 15, 20].forEach((t, i) => { li.children[i + 2].textContent = cmp(PP(p, t)); });
    else { li.children[2].textContent = cmp(PP(p)); li.children[3].textContent = '+' + Math.round(PG(p)) + ' ' + tr('bAvg'); }
    li.setAttribute('aria-current', BRG.cur === p.rank); li.tabIndex = 0;
    li.addEventListener('click', () => pickBrg(BRG.cur === p.rank ? null : p.rank));
    li.addEventListener('keydown', e => { if (e.key === 'Enter') pickBrg(BRG.cur === p.rank ? null : p.rank); });
    ul.appendChild(li);
  });
  const d = $('bdet'); d.innerHTML = ''; d.hidden = BRG.cur == null; s.hidden = BRG.cur != null;
  if (BRG.cur != null) {
    const p = BRG.br.features.find(f => f.properties.rank === BRG.cur).properties;
    const h = document.createElement('div'); h.style.fontWeight = 600; h.textContent = '#' + p.rank + ' · '; const r = document.createElement('bdi'); r.textContent = roadOf(p); h.appendChild(r); d.appendChild(h);
    add(d, 'big', fmt(PP(p))); add(d, 'lead', tr('bBig')(TT()));
    [ALL ? tr('bDetAll')(PP(p, 10), PP(p, 20)) : tr('bGain')(PG(p)), ...(ALL ? [tr('bGainAll')(PG(p, 10), PG(p, 15), PG(p, 20))] : []), tr('bSpan')(p.span_m, T[lang].rc[p.road_class] || p.road_class),
     tr('bNear')(p.near_station, p.near_station_m), tr('bDet')(p.detour_m), tr('bEx')(p.existing_crossing_m)].forEach(t => { const q = document.createElement('p'); q.textContent = t; d.appendChild(q); });
    if (p.kind === 'reconnexion') add(d, 'flag', tr('bCut'));
    if (p['note_' + lang]) add(d, 'flag', p['note_' + lang]);
    if (p.span_m < 40) add(d, 'flag', tr('bShort'));
    const b = document.createElement('button'); b.id = 'bback'; b.type = 'button'; b.textContent = '← ' + tr('bBack');
    b.addEventListener('click', () => pickBrg(null)); d.appendChild(b);
  }
  const lg = $('bleg'); lg.innerHTML = ''; const lp = document.createElement('p'); lp.textContent = ALL ? tr('bLegAll') : tr('bLeg')(BRG.t); lg.appendChild(lp);
  (ALL ? [10, 15, 20] : [BRG.t]).forEach(t => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<span class="sw"></span><span></span>';
    r.children[0].style.cssText = 'background:' + ZC[t] + ';opacity:' + (ZO[t] + .25) + ';border-color:' + ZC[t]; r.children[1].textContent = (ALL ? tr('bWithin') : '') + t + ' min'; lg.appendChild(r); });
  if ($('bex').checked) tr('bExLeg').forEach((t, i) => {
    const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<span style="width:22px;display:flex;justify-content:center;flex:none"><i class="exb' + (i ? ' off' : '') + '" style="display:block;width:11px;height:11px"></i></span><span></span>';
    r.children[1].textContent = t; lg.appendChild(r);
  });
}
function pickBrg(rank) { BRG.cur = rank; showBrg(); drawBrg(true); if (rank != null) sheetDown(); }
$('bex').addEventListener('change', () => { drawBrg(false); showBrg(); });
document.querySelectorAll('#bseg button').forEach(b => b.addEventListener('click', () => { BRG.t = b.dataset.t === 'all' ? 'all' : +b.dataset.t; showBrg(); drawBrg(BRG.cur != null); }));

/* ================= TABS ================= */
function setTab(t, keepUrl) {
  tab = t;
  $('tabR').setAttribute('aria-selected', t === 'reach'); $('tabC').setAttribute('aria-selected', t === 'cov'); $('tabB').setAttribute('aria-selected', t === 'brg');
  $('pR').hidden = t !== 'reach'; $('pC').hidden = t !== 'cov'; $('pB').hidden = t !== 'brg';
  $('summer').hidden = t === 'brg'; $('legend').hidden = t === 'brg';
  if (!keepUrl) try { history.replaceState(null, '', t === 'cov' ? '#coverage' : t === 'brg' ? '#footbridges' : location.pathname + location.search); } catch (e) {}
  if (t !== 'brg') clearBrg();
  if (t === 'reach') {
    clearCov(); cv.style.display = ''; if (om) om.addTo(map); refreshGrid();
  } else if (t === 'brg') {
    clearCov(); cv.style.display = 'none'; tip.style.display = 'none'; if (om) map.removeLayer(om);
    $('bsum').hidden = false; $('bsum').className = ''; $('bsum').textContent = tr('loadingB');
    loadBrg().then(() => { if (tab !== 'brg') return; showBrg(); drawBrg(!BRG._opened); BRG._opened = true; })
      .catch(e => { $('bsum').className = 'error'; $('bsum').textContent = tr('err') + (e.message || '') + tr('err2b'); });
  } else {
    cv.style.display = 'none'; tip.style.display = 'none'; if (om) map.removeLayer(om);
    $('info').className = ''; $('info').textContent = tr('loadingC');
    loadCov().then(() => { if (tab !== 'cov') return; buildSelect(); COV.view === 'one' && COV.cur ? select(COV.cur) : COV.view === '' && COV.cur === null && COV._opened ? resetC() : showAll(); COV._opened = true; })
      .catch(e => { $('info').className = 'error'; $('info').textContent = tr('err') + (e.message || '') + tr('err2c'); });
  }
  texts(); showLegend();
}
$('tabR').addEventListener('click', () => setTab('reach'));
$('tabC').addEventListener('click', () => setTab('cov'));
$('tabB').addEventListener('click', () => setTab('brg'));

/* ================= TEXTS / LANGUAGE ================= */
function texts() {
  $('sub').textContent = tab === 'brg' ? tr('subB') : tab === 'cov' ? tr('subC') : (P.only ? tr('subW') : tr('subR'));
  $('hint').textContent = TOUCH ? tr('hintTouch') : P.only ? tr('hintW') : tr('hintM');
  if (TOUCH) $('follow').hidden = true;
  $('note').textContent = tab === 'brg' ? tr('noteB') : tab === 'cov' ? tr('noteC') : tr('noteR');
  $('t_summer').textContent = tr('summer'); $('t_summerS').textContent = tr('summerS')(P.cap);
}
function applyLang() {
  document.documentElement.lang = lang; document.title = tr('title') + ' – Riyadh';
  $('t1').textContent = tr('title'); $('lang').textContent = tr('toggle');
  $('t_tabR').textContent = tr('tabR'); $('t_tabRs').textContent = tr('tabRs'); $('t_tabC').textContent = tr('tabC'); $('t_tabCs').textContent = tr('tabCs');
  $('t_tabB').textContent = tr('tabB'); $('t_tabBs').textContent = tr('tabBs'); $('t_bex').textContent = tr('bExL');
  $('segM').textContent = tr('segM'); $('segW').textContent = tr('segW'); $('lset').textContent = tr('set'); $('t_how').textContent = tr('how');
  $('t_wt').textContent = tr('wt'); [...$('sty').options].forEach(o => { o.textContent = o.value === 'near' ? tr('allT') : tr('allO'); });
  document.querySelectorAll('#chips .tm').forEach(e => { e.textContent = e.dataset.m + ' ' + tr('min'); });
  SL.forEach(([k]) => { const b = $('sl_' + k); b.firstChild.textContent = tr(k); b._show(); });
  document.querySelectorAll('.basectl button').forEach(b => { b.textContent = tr('b_' + b.dataset.b); });
  $('infob').title = tr('info'); $('infob').setAttribute('aria-label', tr('info')); $('ab_c').innerHTML = tr('about');
  const c = $('t_credit'); c.textContent = tr('credit'); const a = document.createElement('a'); a.href = '#'; a.textContent = tr('creditMore');
  a.addEventListener('click', e => { e.preventDefault(); openAbout(); }); c.appendChild(a);
  texts(); setFollow(); report(); showLegend();
  if (COV.iso) { buildSelect(); if (tab === 'cov') { showInfoC(); showStat(); } }
  if (BRG.st && tab === 'brg') showBrg();
}
let lastFocus = null;
function openAbout() { lastFocus = document.activeElement; $('about').hidden = false; $('closeb').focus(); }
function closeAbout() { $('about').hidden = true; if (lastFocus) lastFocus.focus(); }
$('infob').addEventListener('click', openAbout);
$('closeb').addEventListener('click', closeAbout);
$('about').addEventListener('click', e => { if (e.target === $('about')) closeAbout(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('about').hidden) closeAbout(); });
$('lang').addEventListener('click', () => { lang = lang === 'en' ? 'fr' : 'en'; applyLang(); });
applyLang(); $('sl_cap').hidden = true;

/* ================= LOAD ================= */
$('out').textContent = tr('loading');
Promise.all(['network.json', 'lignes.geojson', 'walk_graph.json'].map(getJSON))
.then(([net, lines, wg]) => {
  setup(net); buildWalk(wg);
  // station access: streets on every side within 100 m (precomputed in network.json as [lon, lat, metres from the station])
  S.forEach(s => {
    const acc = s.acc && s.acc.length ? s.acc : [[s.x, s.y, null]];
    s.sps = acc.map(a => { const m = toM(a[1], a[0]), sp = snap(m[0], m[1], a[2] == null ? 1000 : 30); if (sp && a[2] != null) sp.d = a[2]; return sp; }).filter(Boolean);
    s.sp = s.sps[0];
  });
  L.geoJSON(lines, {pane:'lines', style:{color:'#fff', weight:7, opacity:.9}}).addTo(map);
  L.geoJSON(lines, {pane:'lines', style: f => ({color: LINE_COLORS[String(f.properties.lines || '').split('|')[0].trim()] || '#666', weight:4, opacity:.95})}).addTo(map);
  S.forEach(s => {
    const m = L.circleMarker([s.y, s.x], Object.assign({pane:'stations'}, base)).addTo(map); markers[s.n] = m;
    m.bindTooltip(() => s.n + ' · ' + s.lines.map(c => T[lang].lines[c] || c).join(', '));
    m.on('click', ev => { L.DomEvent.stop(ev);
      if (tab === 'reach') { follow = false; setFollow(); origin = L.latLng(s.y, s.x); paint(); }
      else if (COV.iso) select(s.n); });
  });
  origin = L.latLng(LAT0, LNG0);
  om = L.circleMarker(origin, {pane:'stations', radius:8, color:'#16222b', weight:2, fillColor:'#ffd400', fillOpacity:1, interactive:false});
  map.fitBounds(L.latLngBounds(S.map(s => [s.y, s.x])), {padding:[40, 40]});
  if (location.hash === '#footbridges') setTab('brg', true); else if (location.hash === '#coverage') setTab('cov', true); else { om.addTo(map); refreshGrid(); }
})
.catch(e => { $('out').className = 'error'; $('out').textContent = tr('err') + (e.message || '') + tr('err2'); });
</script>
