<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Within metro reach – Riyadh</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400&display=swap">
<style>
:root{--ink:#16222b;--muted:#5d6b75;--paper:#fbfaf7;--rule:#d9d5cc}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink)}
#map{height:100%;background:#e8e6e0}
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:300px;max-width:calc(100% - 24px);box-sizing:border-box;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.45;box-shadow:0 4px 18px rgba(22,34,43,.18);max-height:calc(100% - 24px);overflow:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h1{font-size:19px;line-height:1.2;margin:0 0 4px;font-weight:600}
#lang{font:inherit;font-size:12px;padding:3px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
select{width:100%;font:inherit;padding:7px 8px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
select:focus-visible,#lang:focus-visible{outline:2px solid #1f6a7d;outline-offset:1px}
#wtrow{margin-top:8px;font-size:13px;color:var(--muted)}
#wtrow select{margin-top:3px}
#info{margin:12px 0;min-height:44px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend{border-top:1px solid var(--rule);padding-top:10px}
.legend p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.sw{width:22px;height:12px;border-radius:2px;border:1px solid rgba(22,34,43,.25);flex:none}
.lab{width:52px;flex:none}
.bar{flex:1;height:6px;background:#e7e4dc;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#1f6a7d}
.val{width:62px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font-size:12px;color:var(--muted)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
#chips label{display:flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer}
#chips input{margin:0}
.error{color:#9b1c1c}
.leaflet-tooltip{font-family:inherit}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="top"><h1 id="t_title"></h1><button id="lang" type="button"></button></div>
  <p class="sub" id="t_sub"></p>
  <select id="sel"></select>
  <div id="wtrow" hidden><div id="t_wt"></div><div id="chips"></div><select id="sty" aria-label="Display"></select></div>
  <div id="info"></div>
  <div class="legend" id="legend"></div>
  <p class="note" id="t_note"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LINE_ORDER = ['Blue','Red','Orange','Yellow','Green','Purple'];
const LINE_COLORS = {Blue:'#1d6fc4', Red:'#e03a3a', Orange:'#f28c28', Yellow:'#f5c400', Green:'#2e9e4f', Purple:'#8a4fb8'};
const MIN_COLORS = {5:'#cfe8ec', 10:'#9ccbd4', 15:'#69aebb', 20:'#3f8c9b', 25:'#236b7c', 30:'#0f3d4c'};
const KMH = 4.8;
const T = {
 en:{title:'Within metro reach', sub:'Riyadh: how far you can walk from each station.', choose:'Choose a station', all:'All stations (overlaid)',
  hint:'Click a station on the map or pick one from the list. Hover a zone for its figures.', allHint:'All stations at once: the darker the area, the more stations reach it within the chosen time.',
  wt:'Walking time shown', allT:'Nearest station (opaque)', allO:'Overlaid (transparent)', allHintO:'Walking zones of all stations, overlaid with transparency: the darker the area, the more zones cover it. Tick the walking times to show.', allHintT:'All stations and all walking times at once. Each colour shows the walking time to the nearest station: the darker, the farther.', leg:'Walking time (darker = farther)', min:'min', ex:'Interchange station', none:'No area computed for this station.',
  note:'Walking at 4.8 km/h on the OpenStreetMap pedestrian network; where OpenStreetMap is incomplete, areas are underestimated. Bars: area reached as a share of the disc you would cover walking in a straight line (a short bar means the street network forces detours).',
  walk:'walk', disc:'of the straight-line disc', err:'Could not load ', err2:'. Check that the three .geojson files sit next to this page and open it from a web server such as GitHub Pages.', other:'Other', toggle:'Français',
  lines:{Blue:'Blue Line',Red:'Red Line',Orange:'Orange Line',Yellow:'Yellow Line',Green:'Green Line',Purple:'Purple Line'}},
 fr:{title:'À portée de métro', sub:"Riyadh : jusqu'où aller à pied depuis chaque station.", choose:'Choisir une station', all:'Toutes les stations (superposées)',
  hint:'Clique sur une station de la carte ou choisis-la dans la liste. Survole une zone pour ses chiffres.', allHint:'Toutes les stations à la fois : plus la zone est foncée, plus de stations la desservent dans le temps choisi.',
  wt:'Temps de marche affiché', allT:'Station la plus proche (opaque)', allO:'Superposé (transparent)', allHintO:'Zones de marche de toutes les stations, superposées en transparence : plus la zone est foncée, plus elle est couverte par de zones. Coche les temps de marche à afficher.', allHintT:"Toutes les stations et tous les temps de marche à la fois. Chaque couleur indique le temps de marche jusqu'à la station la plus proche : plus c'est foncé, plus c'est loin.", leg:'Temps de marche (plus foncé = plus loin)', min:'min', ex:'Station de correspondance', none:'Aucune zone calculée pour cette station.',
  note:"Marche à 4,8 km/h sur le réseau piéton d'OpenStreetMap ; là où OpenStreetMap est incomplet, les zones sont sous-estimées. Barres : surface atteinte rapportée au disque qu'on couvrirait en ligne droite (une barre courte indique des détours imposés par les rues).",
  walk:'à pied', disc:'du disque en ligne droite', err:'Impossible de charger ', err2:'. Vérifie que les trois fichiers .geojson sont à côté de cette page et ouvre-la depuis un serveur web comme GitHub Pages.', other:'Autres', toggle:'English',
  lines:{Blue:'Ligne bleue',Red:'Ligne rouge',Orange:'Ligne orange',Yellow:'Ligne jaune',Green:'Ligne verte',Purple:'Ligne violette'}}
};
let lang = 'en', mode = '', cur = null, styleMode = 'near'; const on = new Set([5, 10, 15, 20, 25, 30]);
const tr = k => T[lang][k];
const $ = id => document.getElementById(id);

const map = L.map('map', {zoomControl:false}).setView([24.71, 46.69], 11);
L.control.zoom({position:'topright'}).addTo(map);
[['iso',350],['labels',400],['lines',450],['stations',650]].forEach(([n,z]) => { map.createPane(n).style.zIndex = z; });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:16, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:16, pane:'labels'}).addTo(map);

const legend = $('legend'); legend.innerHTML = '<p id="t_leg"></p>';
Object.keys(MIN_COLORS).forEach(m => {
  const r = document.createElement('div'); r.className = 'row'; r.dataset.m = m;
  r.innerHTML = '<span class="sw" style="background:' + MIN_COLORS[m] + '"></span><span class="lab">' + m + ' <span class="u"></span></span><span class="bar"><i></i></span><span class="val"></span>';
  legend.appendChild(r);
});
Object.keys(MIN_COLORS).forEach(m => {
  const l = document.createElement('label'), c = document.createElement('input'), sw = document.createElement('span'), t = document.createElement('span');
  c.type = 'checkbox'; c.checked = true; c.value = m;
  sw.className = 'sw'; sw.style.cssText = 'background:' + MIN_COLORS[m] + ';width:10px;height:10px';
  t.className = 'tm'; t.dataset.m = m; t.textContent = m + ' min';
  l.append(c, sw, t); $('chips').appendChild(l);
});
['ov', 'near'].forEach(v => { const o = document.createElement('option'); o.value = v; $('sty').appendChild(o); });
$('sty').value = styleMode;

function area(g) { // km², from lon/lat
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates; let a = 0;
  polys.forEach(p => p.forEach((ring, i) => {
    const kx = 111.32 * Math.cos(ring[0][1] * Math.PI / 180), ky = 110.57; let s = 0;
    for (let j = 0; j < ring.length - 1; j++) s += ring[j][0] * kx * ring[j+1][1] * ky - ring[j+1][0] * kx * ring[j][1] * ky;
    a += (i === 0 ? 1 : -1) * Math.abs(s / 2);
  }));
  return a;
}
const pctOf = (a, m) => 100 * a / (Math.PI * Math.pow(KMH * m / 60, 2));
const lineList = p => String(p.lines || '').split('|').map(s => s.trim()).filter(Boolean);

Promise.all([fetch('isochrones_pied.geojson'), fetch('lignes.geojson'), fetch('stations.geojson')].map(p => p.then(r => { if (!r.ok) throw new Error(r.url); return r.json(); })))
.then(([iso, lines, sts]) => {
  const byStation = {};
  iso.features.forEach(f => { f.properties._a = area(f.geometry); (byStation[f.properties.station] = byStation[f.properties.station] || []).push(f); });

  L.geoJSON(lines, {pane:'lines', style: f => ({color: LINE_COLORS[lineList(f.properties)[0]] || '#666', weight:4, opacity:.95})}).addTo(map);

  const markers = {}, props = {}, base = {radius:6, color:'#16222b', weight:2, fillColor:'#fff', fillOpacity:1};
  L.geoJSON(sts, {
    pointToLayer: (f, ll) => L.circleMarker(ll, Object.assign({pane:'stations'}, base)),
    onEachFeature: (f, l) => {
      const n = f.properties.Name_ENG; markers[n] = l; props[n] = f.properties;
      l.bindTooltip(() => n + ' · ' + lineList(props[n]).map(c => T[lang].lines[c] || c).join(', '));
      l.on('click', () => select(n));
    }
  }).addTo(map);

  let isoLayer = null;
  const clearIso = () => { if (isoLayer) map.removeLayer(isoLayer); isoLayer = null; if (cur && markers[cur]) markers[cur].setStyle(base); };

  function buildSelect() {
    const keep = mode === 'all' ? '__all' : (cur || ''); $('sel').innerHTML = '';
    const add = (p, v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; p.appendChild(o); return o; };
    add($('sel'), '', tr('choose')); add($('sel'), '__all', tr('all'));
    const names = Object.keys(props).sort(), used = new Set();
    LINE_ORDER.forEach(c => {
      const inLine = names.filter(n => lineList(props[n]).includes(c)); if (!inLine.length) return;
      const g = document.createElement('optgroup'); g.label = '● ' + T[lang].lines[c]; g.style.color = LINE_COLORS[c];
      inLine.forEach(n => { used.add(n); add(g, n, n).style.color = '#16222b'; }); $('sel').appendChild(g);
    });
    const rest = names.filter(n => !used.has(n));
    if (rest.length) { const g = document.createElement('optgroup'); g.label = tr('other'); rest.forEach(n => add(g, n, n)); $('sel').appendChild(g); }
    $('sel').value = keep;
  }

  function showInfo() {
    const el = $('info'); el.innerHTML = '';
    const add = (t, b) => { const d = document.createElement('div'); if (b) d.style.fontWeight = 600; d.textContent = t; el.appendChild(d); return d; };
    if (mode === 'all') { add(styleMode === 'near' ? tr('allHintT') : tr('allHintO')); return; }
    if (mode !== 'one') { add(tr('hint')); return; }
    add(cur, true);
    const d = document.createElement('div');
    lineList(props[cur]).forEach(c => { const s = document.createElement('span'); s.style.marginRight = '10px';
      s.innerHTML = '<span class="dot" style="background:' + (LINE_COLORS[c] || '#666') + '"></span>'; s.append(T[lang].lines[c] || c); d.appendChild(s); });
    el.appendChild(d);
    const ex = props[cur].Echange && !/^(no|non|0|false)$/i.test(String(props[cur].Echange));
    if (ex) add(tr('ex'));
    if (!(byStation[cur] || []).length) add(tr('none'));
  }

  function showLegend() {
    legend.querySelectorAll('.row').forEach(r => {
      const m = r.dataset.m, f = mode === 'one' && (byStation[cur] || []).find(x => String(x.properties.minutes) === m);
      r.querySelector('.u').textContent = tr('min');
      r.querySelector('.val').textContent = f ? f.properties._a.toFixed(1) + ' km²' : '';
      r.querySelector('.bar i').style.width = f ? Math.min(100, pctOf(f.properties._a, +m)).toFixed(0) + '%' : '0';
      r.title = f ? pctOf(f.properties._a, +m).toFixed(0) + '% ' + tr('disc') : '';
    });
  }

  const tip = (f, l) => l.bindTooltip(() => f.properties.station + ' · ' + f.properties.minutes + ' ' + tr('min') + ' ' + tr('walk') + '\n' +
    f.properties._a.toFixed(1) + ' km² · ' + pctOf(f.properties._a, f.properties.minutes).toFixed(0) + '% ' + tr('disc'), {sticky:true});

  function select(name) {
    clearIso(); mode = 'one'; cur = name; $('sel').value = name; $('wtrow').hidden = true;
    markers[name].setStyle({radius:9, fillColor:'#ffd400'});
    const feats = (byStation[name] || []).slice().sort((a, b) => b.properties.minutes - a.properties.minutes);
    isoLayer = L.geoJSON(feats, {pane:'iso',
      style: f => ({color: MIN_COLORS[f.properties.minutes], weight:1, opacity:.9, fillColor: MIN_COLORS[f.properties.minutes], fillOpacity:.55}),
      onEachFeature: (f, l) => { tip(f, l); l.on('mouseover', () => l.setStyle({weight:3, color:'#16222b'})); l.on('mouseout', () => isoLayer.resetStyle(l)); }}).addTo(map);
    if (feats.length) map.fitBounds(isoLayer.getBounds(), {padding:[40, 40], maxZoom:14});
    showInfo(); showLegend();
  }

  function showAll(fit = true) {
    clearIso(); mode = 'all'; cur = null; $('wtrow').hidden = false;
    const every = styleMode === 'near', feats = iso.features.filter(f => on.has(+f.properties.minutes)).sort((a, b) => b.properties.minutes - a.properties.minutes);
    isoLayer = L.geoJSON(feats, {pane:'iso', style: f => { const c = MIN_COLORS[f.properties.minutes]; return every ? {color:c, weight:0, fillColor:c, fillOpacity:.7} : {color:c, weight:.5, opacity:.6, fillColor:c, fillOpacity: on.size > 1 ? .12 : .2}; },
      onEachFeature: (f, l) => { tip(f, l); l.on('mouseover', () => l.setStyle({weight:2.5, color:'#16222b', fillOpacity: every ? .7 : .45})); l.on('mouseout', () => isoLayer.resetStyle(l));
        l.on('click', () => select(f.properties.station)); }}).addTo(map);
    if (fit && feats.length) map.fitBounds(isoLayer.getBounds(), {padding:[40, 40]});
    showInfo(); showLegend();
  }

  function reset() { clearIso(); mode = ''; cur = null; $('wtrow').hidden = true; showInfo(); showLegend(); }

  function applyLang() {
    document.documentElement.lang = lang; document.title = tr('title') + ' – Riyadh';
    $('t_title').textContent = tr('title'); $('t_sub').textContent = tr('sub'); $('t_note').textContent = tr('note');
    $('t_wt').textContent = tr('wt'); $('t_leg').textContent = tr('leg'); $('lang').textContent = tr('toggle');
    [...$('sty').options].forEach(o => { o.textContent = o.value === 'near' ? tr('allT') : tr('allO'); });
    document.querySelectorAll('#chips .tm').forEach(e => { e.textContent = e.dataset.m + ' ' + tr('min'); });
    buildSelect(); showInfo(); showLegend();
  }

  $('sel').addEventListener('change', () => { const v = $('sel').value; v === '__all' ? showAll() : v ? select(v) : reset(); });
  $('chips').addEventListener('change', e => { const c = e.target, m = +c.value; c.checked ? on.add(m) : on.delete(m); if (mode === 'all') showAll(false); });
  $('sty').addEventListener('change', () => { styleMode = $('sty').value; if (mode === 'all') showAll(false); });
  $('lang').addEventListener('click', () => { lang = lang === 'en' ? 'fr' : 'en'; applyLang(); });
  applyLang();
  showAll(); $('sel').value = '__all';   // ouverture : toutes les stations superposées
})
.catch(e => {
  $('info').className = 'error';
  $('info').textContent = tr('err') + (e.message || '') + tr('err2');
});
$('t_title').textContent = tr('title'); $('t_sub').textContent = tr('sub'); $('t_note').textContent = tr('note'); $('lang').textContent = tr('toggle'); $('t_leg').textContent = tr('leg');
$('sel').innerHTML = '<option>' + tr('choose') + '</option>'; $('info').textContent = tr('hint');
</script>
</body>
</html>
