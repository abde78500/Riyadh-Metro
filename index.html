  err:'Could not load ', loading:'Loading the walking network…', nostreet:'No street within walking reach of this point.', err2:'. Check that network.json, lignes.geojson and walk_graph.json sit next to this page and open it from a web server such as GitHub Pages.', toggle:'Français', tabM:'Metro time', tabW:'Walking reach', new:'+ population', info:'About: sources and method', credit:'Map by KHAMASSI Abderrahmane · ', creditMore:'sources & method', about:"<h2 id=\"ab_t\">About this map</h2><p class=\"by\">A project by KHAMASSI Abderrahmane</p>\n<p>Pick a start point (move the mouse, or click the map or a station) to see how long it takes to reach every part of Riyadh by walking and riding the metro. The companion <a href=\"pied.html\">walking map</a> shows how far you can walk from each station and how many people live within reach.</p>\n<h3>Method</h3><ul>\n<li>The metro network is built from the 6 lines and 83 stations mapped in OpenStreetMap, with the distance between consecutive stations along each line.</li>\n<li>Walking follows the real pedestrian network built from OpenStreetMap streets and paths (motorways excluded), keeping its largest connected part. Each point is attached to the nearest street; areas more than 400 m from any street are left blank.</li>\n<li>Travel time = walk to a station + wait for a train + ride (+ transfers) + walk from the arrival station. The fastest combination is found with Dijkstra's algorithm on both networks, computed live in your browser.</li>\n<li>Default assumptions, adjustable in the panel: walking 4.8 km/h; metro commercial speed 40 km/h; 3 min wait (headways of 3–5 min at peak, 5–10 min off-peak); 5 min per transfer.</li></ul>\n<h3>Limits</h3><ul>\n<li>No timetable, no crowding, no traffic: these are typical times, not a journey planner.</li>\n<li>Where OpenStreetMap lacks footpaths, or includes private compounds, walking times can be over- or underestimated. Large roads are assumed crossable wherever streets meet.</li>\n };
let lang = 'en';
const tr = k => T[lang][k];
const $ = id => document.getElementById(id);
const P = {speed:40, wait:3, transfer:5, walk:4.8, only:false};
const CELL = 8;

/* CORE */
let S = [], NODE = [], ADJ = [], KX = 1, KY = 110574, LAT0 = 24.7, LNG0 = 46.7;
function toM(lat, lng) { return [(lng - LNG0) * KX, (lat - LAT0) * KY]; }
function setup(net) {
  const la = net.stations.map(s => s.y), lo = net.stations.map(s => s.x);
  LAT0 = la.reduce((a, b) => a + b) / la.length; LNG0 = lo.reduce((a, b) => a + b) / lo.length;
  KX = 111320 * Math.cos(LAT0 * Math.PI / 180);
  S = net.stations.map(s => Object.assign({m: toM(s.y, s.x), nodes: []}, s));
  NODE = []; ADJ = [];
  const id = {};
  S.forEach((s, i) => s.lines.forEach(l => { id[i + '|' + l] = NODE.length; s.nodes.push(NODE.length); NODE.push(i); ADJ.push([]); }));
  net.edges.forEach(([a, b, km, l]) => { const p = id[a + '|' + l], q = id[b + '|' + l]; if (p == null || q == null) return; ADJ[p].push([q, km, 0]); ADJ[q].push([p, km, 0]); });
  S.forEach(s => s.nodes.forEach(p => s.nodes.forEach(q => { if (p !== q) ADJ[p].push([q, 0, 1]); })));
}
const wm = () => P.walk * 1000 / 60;
/* WALK NETWORK: real OpenStreetMap pedestrian graph (walk_graph.json) */
let WN = null;
const GCELL = 250, SNAP_GRID = 400, SNAP_PT = 1500;
function buildWalk(g) {
  const N = g.nodes.length / 2, M = g.edges.length / 3;
  const NX = new Float64Array(N), NY = new Float64Array(N);
  for (let i = 0; i < N; i++) { const m = toM(g.nodes[2 * i + 1] / 1e5, g.nodes[2 * i] / 1e5); NX[i] = m[0]; NY[i] = m[1]; }
  const EA = new Int32Array(M), EB = new Int32Array(M), EL = new Float32Array(M), deg = new Int32Array(N);
  for (let e = 0; e < M; e++) { EA[e] = g.edges[3 * e]; EB[e] = g.edges[3 * e + 1]; EL[e] = g.edges[3 * e + 2]; deg[EA[e]]++; deg[EB[e]]++; }
  const OFF = new Int32Array(N + 1); for (let i = 0; i < N; i++) OFF[i + 1] = OFF[i] + deg[i];
  const AN = new Int32Array(2 * M), AE = new Int32Array(2 * M), pos = OFF.slice(0, N);
  for (let e = 0; e < M; e++) { AN[pos[EA[e]]] = EB[e]; AE[pos[EA[e]]++] = e; AN[pos[EB[e]]] = EA[e]; AE[pos[EB[e]]++] = e; }
  // spatial grid of edges, to attach any point to the nearest street
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < N; i++) { if (NX[i] < x0) x0 = NX[i]; if (NX[i] > x1) x1 = NX[i]; if (NY[i] < y0) y0 = NY[i]; if (NY[i] > y1) y1 = NY[i]; }
  const GW = Math.ceil((x1 - x0) / GCELL) + 1, GH = Math.ceil((y1 - y0) / GCELL) + 1, cnt = new Int32Array(GW * GH + 1);
  const each = (e, f) => { const a = EA[e], b = EB[e];
    const c0 = Math.floor((Math.min(NX[a], NX[b]) - x0) / GCELL), c1 = Math.floor((Math.max(NX[a], NX[b]) - x0) / GCELL);
    const r0 = Math.floor((Math.min(NY[a], NY[b]) - y0) / GCELL), r1 = Math.floor((Math.max(NY[a], NY[b]) - y0) / GCELL);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) f(r * GW + c); };
  for (let e = 0; e < M; e++) each(e, k => { cnt[k + 1]++; });
  for (let k = 0; k < GW * GH; k++) cnt[k + 1] += cnt[k];
  const CED = new Int32Array(cnt[GW * GH]), cp = cnt.slice(0, GW * GH);
  for (let e = 0; e < M; e++) each(e, k => { CED[cp[k]++] = e; });
  const cap = 2 * M + 4 * S.length + 16;
  WN = {N, NX, NY, EA, EB, EL, OFF, AN, AE, GX0:x0, GY0:y0, GW, GH, COFF:cnt, CED,
        HK:new Float32Array(cap), HN:new Int32Array(cap), DA:new Float32Array(N), DB:new Float32Array(N)};
}
// nearest point on a street: {e, f (0..1 from EA to EB), d (metres off the street)}, or null beyond maxR
function snap(x, y, maxR) {
  const w = WN, cx = Math.floor((x - w.GX0) / GCELL), cy = Math.floor((y - w.GY0) / GCELL), R = Math.ceil(maxR / GCELL);
  let be = -1, bf = 0, bd = maxR;
  for (let ring = 0; ring <= R; ring++) {

    for (let r = cy - ring; r <= cy + ring; r++) {
      if (r < 0 || r >= w.GH) continue;
      const edge = r === cy - ring || r === cy + ring;
      for (let c = cx - ring; c <= cx + ring; c += (edge || ring === 0) ? 1 : 2 * ring) {
        if (c < 0 || c >= w.GW) continue;
        const k = r * w.GW + c;
        for (let j = w.COFF[k]; j < w.COFF[k + 1]; j++) {
          const e = w.CED[j], ax = w.NX[w.EA[e]], ay = w.NY[w.EA[e]], dx = w.NX[w.EB[e]] - ax, dy = w.NY[w.EB[e]] - ay, l2 = dx * dx + dy * dy;
          let f = l2 > 0 ? ((x - ax) * dx + (y - ay) * dy) / l2 : 0; f = f < 0 ? 0 : f > 1 ? 1 : f;

// Dijkstra on the pedestrian graph (minutes); src = [[node, time], ...]
function walkDijkstra(src, D, tmax) {
  const w = WN, W = wm(), HK = w.HK, HN = w.HN; D.fill(Infinity); let n = 0;
  const push = (v, k) => { let i = n++; while (i > 0) { const p = (i - 1) >> 1; if (HK[p] <= k) break; HK[i] = HK[p]; HN[i] = HN[p]; i = p; } HK[i] = k; HN[i] = v; };
  for (const [v, t] of src) if (t < D[v] && t < tmax) { D[v] = t; push(v, t); }
  while (n) {

    if (n) { const lk = HK[n], lv = HN[n]; let i = 0;

}
// time at a snapped point from node times D (o = origin snap, for points on the same street)
function tSnap(sp, D, o) {

const srcOf = (sp, t0) => { const w = WN, W = wm(), L = w.EL[sp.e]; return [[w.EA[sp.e], t0 + (sp.d + sp.f * L) / W], [w.EB[sp.e], t0 + (sp.d + (1 - sp.f) * L) / W]]; };
function solve(ox, oy) {

  const DA = walkDijkstra(srcOf(o, 0), WN.DA, 60);
  const w = S.map(s => tSnap(s.sp, DA, o));
  if (P.only) return {ox, oy, o, w, E:S.map(() => Infinity), T:DA};
  const d = new Float64Array(n).fill(Infinity), done = new Uint8Array(n);
  for (let k = 0; k < n; k++) d[k] = w[NODE[k]] + P.wait;
  for (let it = 0; it < n; it++) {
    let k = -1, b = Infinity;
    for (let j = 0; j < n; j++) if (!done[j] && d[j] < b) { b = d[j]; k = j; }
    if (k < 0) break;
    done[k] = 1;
    for (const [q, km, tp] of ADJ[k]) { const c = b + (tp ? P.transfer : km / P.speed * 60); if (c < d[q]) d[q] = c; }
  }
  const E = S.map(s => s.nodes.length ? Math.min(...s.nodes.map(k => d[k])) : Infinity);
  // keep walking from the origin and from every station at its arrival time
  const src = srcOf(o, 0); S.forEach((s, i) => { if (s.sp && E[i] < 60) src.push(...srcOf(s.sp, E[i])); });
  const T = walkDijkstra(src, WN.DB, 60);
  return {ox, oy, o, w, E, T};
}
function timeAt(x, y, sol) { return sol && sol.T ? tSnap(snap(x, y, SNAP_GRID), sol.T, sol.o) : Infinity; }
/* END CORE */

const map = L.map('map', {zoomControl:false, zoomAnimation:false}).setView([24.71, 46.69], 11);
L.control.zoom({position:'topright'}).addTo(map);
[['time',360],['labels',400],['lines',450],['stations',650]].forEach(([n, z]) => { map.createPane(n).style.zIndex = z; });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:16, attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:16, pane:'labels'}).addTo(map);

const cv = document.createElement('canvas'), small = document.createElement('canvas'), ctx = cv.getContext('2d'), sctx = small.getContext('2d');
cv.className = 'tm'; map.getPane('time').appendChild(cv);
const tip = document.createElement('div'); tip.id = 'tip'; map.getContainer().appendChild(tip);

let origin = null, sol = null, grid = null, follow = true, raf = 0, om = null;
function refreshGrid() {
  if (!S.length || !WN) return;
  const sz = map.getSize(), cols = Math.ceil(sz.x / CELL), rows = Math.ceil(sz.y / CELL);
  cv.width = sz.x; cv.height = sz.y; small.width = cols; small.height = rows;
  L.DomUtil.setPosition(cv, map.containerPointToLayerPoint([0, 0]));
  const X = new Float32Array(cols * rows), Y = new Float32Array(cols * rows);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const ll = map.containerPointToLatLng([c * CELL + CELL / 2, r * CELL + CELL / 2]), m = toM(ll.lat, ll.lng);
    X[r * cols + c] = m[0]; Y[r * cols + c] = m[1];
  }
  const SP = new Array(cols * rows); for (let i = 0; i < cols * rows; i++) SP[i] = snap(X[i], Y[i], SNAP_GRID);
  grid = {cols, rows, X, Y, SP}; paint();
}
function paint() {
  if (!grid || !origin) return;
  const m0 = toM(origin.lat, origin.lng); sol = solve(m0[0], m0[1]);
  const {cols, rows} = grid, img = sctx.createImageData(cols, rows), a = img.data;
  for (let i = 0; i < cols * rows; i++) {
    const t = sol.T ? tSnap(grid.SP[i], sol.T, sol.o) : Infinity; if (t >= 60) continue;
    const c = RGB[Math.floor(t / 10)]; a[4 * i] = c[0]; a[4 * i + 1] = c[1]; a[4 * i + 2] = c[2]; a[4 * i + 3] = 175;
  }
  sctx.putImageData(img, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.imageSmoothingEnabled = true;
  ctx.drawImage(small, 0, 0, cv.width, cv.height);
  if (om) om.setLatLng(origin);
  report();
}
function report() {
  if (!sol) return;
  const el = $('out'); el.innerHTML = '';
  if (!sol.o || !isFinite(Math.min(...sol.w))) { el.textContent = tr('nostreet'); return; }
  let ni = 0; sol.w.forEach((v, i) => { if (v < sol.w[ni]) ni = i; });
  const d1 = document.createElement('div'); d1.textContent = tr('near') + ': ' + S[ni].n + ' · ' + Math.round(sol.w[ni]) + ' ' + tr('walkmin'); el.appendChild(d1);
  if (P.only) return;
  const c30 = sol.E.filter(e => e <= 30).length, c60 = sol.E.filter(e => e <= 60).length, d2 = document.createElement('div'), b = document.createElement('span');
  b.className = 'big'; b.textContent = c30; d2.append(b, tr('stn') + ' · ' + c60 + ' ' + tr('stn60')); el.appendChild(d2);
}
const later = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); };
function setFollow() { $('follow').setAttribute('aria-pressed', follow); $('follow').textContent = follow ? tr('following') : tr('follow'); if (follow) tip.style.display = 'none'; }

map.on('moveend resize', refreshGrid);
map.on('mousemove', e => {
  if (!S.length || !WN) return;
  if (follow) { origin = e.latlng; later(); return; }
  if (!sol) return;
  const m = toM(e.latlng.lat, e.latlng.lng), t = timeAt(m[0], m[1], sol);
  tip.textContent = t >= 60 ? tr('over') : Math.round(t) + ' ' + tr('min');
  tip.style.left = e.containerPoint.x + 14 + 'px'; tip.style.top = e.containerPoint.y + 14 + 'px'; tip.style.display = 'block';
});
map.on('mouseout', () => { tip.style.display = 'none'; });
map.on('click', e => { follow = false; setFollow(); origin = e.latlng; paint(); });
$('follow').addEventListener('click', () => { follow = !follow; setFollow(); });
$('only').addEventListener('change', () => { P.only = $('only').checked; later(); });

const SL = [['speed', 25, 60, 1, 'kmh'], ['wait', 0, 10, .5, 'min'], ['transfer', 0, 12, .5, 'min'], ['walk', 3, 6, .1, 'kmh']];
SL.forEach(([k, lo, hi, st, u]) => {
  const box = document.createElement('div'), l = document.createElement('span'), v = document.createElement('span'), r = document.createElement('input');
  box.className = 'sl'; l.dataset.k = k; r.type = 'range'; r.min = lo; r.max = hi; r.step = st; r.value = P[k]; v.dataset.u = u;
  const show = () => { v.textContent = (+r.value).toFixed(st < 1 ? 1 : 0) + ' ' + tr(u); };
  r.addEventListener('input', () => { P[k] = +r.value; show(); later(); });
  box.append(l, v, r); $('sliders').appendChild(box); box._show = show; box.id = 'sl_' + k;
});
const legend = $('legend'); legend.innerHTML = '<p id="lleg"></p>';
BANDS.forEach((c, i) => { const r = document.createElement('div'); r.className = 'row'; r.innerHTML = '<span class="sw" style="background:' + c + '"></span>' + (i * 10) + '–' + (i * 10 + 10); legend.appendChild(r); });

function applyLang() {
  document.documentElement.lang = lang; document.title = tr('title') + ' – Riyadh';
  $('t1').textContent = tr('title'); $('sub').textContent = tr('sub'); $('lang').textContent = tr('toggle'); $('lonly').textContent = tr('only');
  $('hint').textContent = tr('hint'); $('lset').textContent = tr('set'); $('note').textContent = tr('note'); $('lleg').textContent = tr('leg');
  SL.forEach(([k]) => { const b = $('sl_' + k); b.firstChild.textContent = tr(k); b._show(); });
  chrome(); setFollow(); report();
}
function chrome() {
  $('t_tabM').textContent = tr('tabM'); $('t_tabW').textContent = tr('tabW'); $('t_new').textContent = tr('new');
  $('infob').title = tr('info'); $('infob').setAttribute('aria-label', tr('info'));
  $('ab_c').innerHTML = tr('about');
  const c = $('t_credit'); c.textContent = tr('credit'); const a = document.createElement('a'); a.href = '#'; a.textContent = tr('creditMore'); a.style.color = '#8a4a28';
  a.addEventListener('click', e => { e.preventDefault(); openAbout(); }); c.appendChild(a);
}
let lastFocus = null;
function openAbout() { lastFocus = document.activeElement; $('about').hidden = false; $('closeb').focus(); }
function closeAbout() { $('about').hidden = true; if (lastFocus) lastFocus.focus(); }
$('infob').addEventListener('click', openAbout);
$('closeb').addEventListener('click', closeAbout);
$('about').addEventListener('click', e => { if (e.target === $('about')) closeAbout(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('about').hidden) closeAbout(); });
$('lang').addEventListener('click', () => { lang = lang === 'en' ? 'fr' : 'en'; applyLang(); });
applyLang();

$('out').textContent = tr('loading');
Promise.all(['network.json', 'lignes.geojson', 'walk_graph.json'].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(r.url); return r.json(); })))
.then(([net, lines, wg]) => {
  setup(net); buildWalk(wg);
  S.forEach(s => { s.sp = snap(s.m[0], s.m[1], 1000); });
  L.geoJSON(lines, {pane:'lines', style:{color:'#fff', weight:7, opacity:.9}}).addTo(map);
  L.geoJSON(lines, {pane:'lines', style: f => ({color: LINE_COLORS[String(f.properties.lines || '').split('|')[0].trim()] || '#666', weight:4, opacity:.95})}).addTo(map);
  S.forEach(s => {
    const m = L.circleMarker([s.y, s.x], {pane:'stations', radius:5, color:'#16222b', weight:2, fillColor:'#fff', fillOpacity:1}).addTo(map);
    m.bindTooltip(s.n);
    m.on('click', ev => { L.DomEvent.stop(ev); follow = false; setFollow(); origin = L.latLng(s.y, s.x); paint(); });
  });
  origin = L.latLng(LAT0, LNG0);
  om = L.circleMarker(origin, {pane:'stations', radius:8, color:'#16222b', weight:2, fillColor:'#ffd400', fillOpacity:1, interactive:false}).addTo(map);
  map.fitBounds(L.latLngBounds(S.map(s => [s.y, s.x])), {padding:[40, 40]});
  refreshGrid();
})
.catch(e => { $('out').className = 'error'; $('out').textContent = tr('err') + (e.message || '') + tr('err2'); });
</script>
