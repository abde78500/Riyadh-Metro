  map.on('mousemove', e => { if (!follow || raf) return; raf = requestAnimationFrame(() => { raf = 0; live(e.latlng); }); });
  map.on('click', e => { if (follow) live(e.latlng); });
  applyLang();
  showAll(); $('sel').value = '__all';   // ouverture : toutes les stations superposées
})
.catch(e => {
  $('info').className = 'error';
  $('info').textContent = tr('err') + (e.message || '') + tr('err2');
});
$('t_title').textContent = tr('title'); $('t_sub').textContent = tr('sub'); $('t_note').textContent = tr('note'); $('lang').textContent = tr('toggle'); $('t_leg').textContent = tr('leg');
$('sel').innerHTML = '<option>' + tr('choose') + '</option>'; $('info').textContent = tr('hint'); $('follow').textContent = tr('follow');
function chrome() {
  $('t_tabM').textContent = tr('tabM'); $('t_tabW').textContent = tr('tabW'); $('t_new').textContent = tr('new');
  $('infob').title = tr('info'); $('infob').setAttribute('aria-label', tr('info'));
  $('ab_c').innerHTML = tr('about');
  const c = $('t_credit'); c.textContent = tr('credit'); const a = document.createElement('a'); a.href = '#'; a.textContent = tr('creditMore'); a.style.color = '#8a4a28';
  a.addEventListener('click', e => { e.preventDefault(); openAbout(); }); c.appendChild(a);
}
let lastFocus = null;
function openAbout() { lastFocus = document.activeElement; $('about').hidden = false; $('closeb').focus(); }
function closeAbout() { $('about').hidden = true; if (lastFocus) lastFocus.focus(); }
$('infob').addEventListener('click', openAbout);
$('closeb').addEventListener('click', closeAbout);
$('about').addEventListener('click', e => { if (e.target === $('about')) closeAbout(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('about').hidden) closeAbout(); });
chrome();
</script>
